<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enter the Garden | SkillMatch</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Italianno&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-page">

<header class="navbar">

    <div class="nav-container">

        <a href="index.html" class="logo">
            <span class="logo-leaf">❧</span>
            Skill<span>Match</span>
        </a>

        <a href="index.html" class="nav-login">
            ← Back Home
        </a>

    </div>

</header>


<main class="login-container">

    <div class="branch-decoration branch-left">
        ❧
    </div>

    <div class="branch-decoration branch-right">
        ❧
    </div>


    <div class="login-card">

        <div class="login-heading">

            <small>
                WELCOME BACK
            </small>

            <h1>
                Enter your
                <em>garden.</em>
            </h1>

            <p>
                Continue your journey of learning,
                working and growing.
            </p>

        </div>


        <form id="loginForm">

            <div class="input-group">

                <label>
                    Email Address
                </label>

                <div class="input-wrapper">

                    <span>✉</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="yourname@example.com"
                        required>

                </div>

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <div class="input-wrapper">

                    <span>✦</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>

            </div>


            <div class="login-options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                class="login-button">

                Enter SkillMatch →

            </button>

        </form>


        <p class="register-text">

            New to the garden?

            <a href="#">
                Create your profile
            </a>

        </p>


        <div class="login-motto">

            ❧ &nbsp;
            Every skill is a seed.
            &nbsp; ❧

        </div>

    </div>

</main>

<script src="js/main.js"></script>

</body>

</html>
