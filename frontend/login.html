<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enter the Garden | SkillMatch</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Italianno&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css?v=4">
    <link rel="stylesheet" href="css/design-system.css?v=4">

</head>

<body class="login-page">

<header class="navbar">

    <div class="nav-container">

        <a href="index.html" class="logo">
            <span class="logo-leaf">❧</span>
            Skill<span>Match</span>
        </a>

        <a href="index.html" class="nav-login">
            ← Back Home
        </a>

    </div>

</header>


<main class="login-container">

    <div class="branch-decoration branch-left">
        ❧
    </div>

    <div class="branch-decoration branch-right">
        ❧
    </div>


    <div class="login-card">

        <div class="login-heading" data-auth-heading>

            <small>
                WELCOME BACK
            </small>

            <h1>
                Enter your
                <em>garden.</em>
            </h1>

            <p>
                Continue your journey of learning,
                working and growing.
            </p>

        </div>


        <form id="loginForm">

            <div id="loginAlert" class="auth-alert" style="display: none;" role="alert" aria-live="assertive">
                <span class="auth-alert-icon">⚠</span>
                <span class="auth-alert-text" id="loginAlertText"></span>
            </div>

            <div class="input-group">

                <label>
                    Email Address
                </label>

                <div class="input-wrapper">

                    <span>✉</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="yourname@example.com"
                        required>

                </div>

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <div class="input-wrapper">

                    <span>✦</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>

            </div>


            <div class="login-options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                class="login-button">

                Enter SkillMatch →

            </button>

        </form>


                <form id="registerForm" style="display: none;">

            <div class="role-selector">
                <button type="button" class="role-btn active" data-role="student">
                    <span class="role-icon">🌿</span>
                    <span class="role-title">Student</span>
                </button>
                <button type="button" class="role-btn" data-role="faculty">
                    <span class="role-icon">🏛️</span>
                    <span class="role-title">Faculty Guide</span>
                </button>
            </div>
            <input type="hidden" id="registerRole" name="role" value="student">

            <div class="input-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <span>✿</span>
                    <input type="text" id="registerName" placeholder="Your full name" required>
                </div>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <span>✉</span>
                    <input type="email" id="registerEmail" placeholder="yourname@example.com" required>
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <span>✦</span>
                    <input type="password" id="registerPassword" placeholder="At least 8 characters" minlength="8" required>
                </div>
            </div>

            <div id="studentFields">
                <div class="input-group">
                    <label>Department</label>
                    <div class="input-wrapper">
                        <span>🌿</span>
                        <input type="text" id="registerDepartment" placeholder="Computer Science Engineering">
                    </div>
                </div>

                <div class="input-group">
                    <label>Year of Study</label>
                    <div class="input-wrapper">
                        <span>◷</span>
                        <input type="text" id="registerYear" placeholder="3rd Year">
                    </div>
                </div>
            </div>

            <div id="facultyFields" style="display: none;">
                <div class="input-group">
                    <label>Department</label>
                    <div class="input-wrapper">
                        <span>🏛️</span>
                        <input type="text" id="registerFacultyDepartment" placeholder="Computer Science Engineering">
                    </div>
                </div>

                <div class="input-group">
                    <label>Designation / Title</label>
                    <div class="input-wrapper">
                        <span>✦</span>
                        <input type="text" id="registerDesignation" placeholder="e.g. Associate Professor / Project Guide">
                    </div>
                </div>

                <div class="input-group">
                    <label>Faculty Passcode</label>
                    <div class="input-wrapper">
                        <span>🔑</span>
                        <input type="password" id="registerFacultyCode" placeholder="Enter faculty passcode (e.g. FACULTY2026)">
                    </div>
                </div>
            </div>

            <button type="submit" class="login-button">
                Create My Profile 🌱
            </button>

        </form>


        <p class="register-text">

            New to the garden?

            <a href="register.html" data-register-toggle>
                Create your profile
            </a>

        </p>


        <div class="login-motto">

            ❧ &nbsp;
            Every skill is a seed.
            &nbsp; ❧

        </div>

    </div>

</main>

<script src="js/main.js?v=4"></script>
<script src="js/live.js?v=4"></script>

</body>

</html>
