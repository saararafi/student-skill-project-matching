services:
  # ------------------------------------------------------------------
  # SkillMatch — Student Skill & Project Matching System
  # Deploy with:  render blueprint launch
  # (or "New > Blueprint" and point it at this repository)
  # ------------------------------------------------------------------
  - type: web
    name: skillmatch
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --preload --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: skillmatch-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "0"

databases:
  - name: skillmatch-db
    plan: free
    region: singapore
    postgresVersion: "16"
